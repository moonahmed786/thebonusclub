# Local development and integration-test dependencies.
# Production uses Neon/Supabase Postgres, and MongoDB Atlas.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bonusclub
      POSTGRES_PASSWORD: bonusclub
      POSTGRES_DB: bonusclub
    ports: ["5432:5432"]
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
